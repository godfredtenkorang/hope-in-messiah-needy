{% extends 'foundation/base.html' %}
{% load static %}
{% block css_files %}
<link rel="stylesheet" type="text/css" href="{% static 'foundation/foundation.css' %}">
<link rel="stylesheet" type="text/css" href="{% static 'foundation/lightbox.css' %}">
{% endblock %}
{% block content %}

<section class="ab-hero" data-aos="fade-in">
  <div class="ab-hero-dot-grid" aria-hidden="true"></div>
  <div class="ab-hero-ring" style="width:500px;height:500px;top:-200px;right:-180px;border:60px solid rgba(240,160,75,0.05);" aria-hidden="true"></div>
  <div class="ab-hero-ring" style="width:240px;height:240px;top:-40px;right:60px;border:2px solid rgba(240,160,75,0.12);" aria-hidden="true"></div>
  <div class="ab-hero-ring" style="width:380px;height:380px;bottom:-180px;left:-140px;border:50px solid rgba(240,160,75,0.05);" aria-hidden="true"></div>

  <div class="">
                 <h1 >Gallery</h1>
            </div>
</section>

                <h1 class="myTitle text-center">Gallery</h1>
            </div>
        </div>
    </div>

<section class="pt-4 pb-4" style="background-color: #cbd1d3;">
    <div class="four"  data-aos="flip-left">
        <h1 class="heading-title"><span>GALLERY</span>These Are <br> Some <em>Categories</em> Of Our Events</h1>
    </div>
    <div class="container">
        <div class="row">
            {% for category in categories %}
            <div class="col-lg-3 col-md-6 col-sm-12 pb-2 p-3 text-center"  data-aos="flip-right">
                <div class="card" style="width: 16rem; height: 18rem">
                    <img class="card-img-top" src="{{ category.image.url }}" alt="Card image cap">
                    <div class="card-body">
                        <a href="{% url 'gallery' category.slug %}" style="text-decoration: none; color:rgb(94, 129, 203)">
                        <h4 class="card-title" >{{ category.name }}</h4>
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
